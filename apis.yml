name: Raytheon

description: >-
  Raytheon is an American aerospace and defense manufacturer operating as a
  business of RTX Corporation, the world's largest aerospace and defense
  company. Raytheon designs, develops, and produces advanced defense systems
  including precision weapons, air and missile defense systems, sensors,
  radar, electronic warfare, command-and-control solutions, and cyber
  capabilities for the U.S. military and allied governments worldwide. Key
  products include the Patriot missile defense system, StormBreaker smart
  weapons, RAIVEN electro-optical/infrared sensor suites, and advanced
  electronic attack systems. Raytheon also develops world-class logistics
  software through the EAGLE team supporting production management, technical
  manual development, and product support data. No public developer API or
  machine-readable specification is available at this time; Raytheon's
  software solutions are deployed within government program contracts.

